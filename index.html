<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f0c29">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿泠 · 我们的以后</title>
<style>
:root{
  --bg0:#0f0c29; --bg1:#1a1440; --bg2:#302b63; --bg3:#24243e;
  --pink:#ff7eb3; --pink2:#ff6a9c; --purple:#8f7bff; --gold:#ffd28a;
  --ink:#f6f2ff; --ink2:#cfc6e8; --muted:#9c92c0;
  --card:rgba(255,255,255,.055); --card-border:rgba(255,255,255,.12);
  --shadow:0 12px 40px rgba(0,0,0,.35);
  --r:20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg0),var(--bg1) 45%,var(--bg2));
  background-attachment:fixed;
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
#stars{position:fixed; inset:0; pointer-events:none; z-index:0;}
.star{position:absolute; border-radius:50%; background:#fff; opacity:.7; animation:twinkle 3.5s ease-in-out infinite;}
@keyframes twinkle{0%,100%{opacity:.15; transform:scale(.7);}50%{opacity:.85; transform:scale(1.15);}}
#app{position:relative; z-index:1; max-width:520px; margin:0 auto; padding:0 16px 96px;}
h1,h2,h3{font-weight:700; letter-spacing:.5px;}
.screen{display:none; animation:fade .4s ease both;}
.screen.active{display:block;}
@keyframes fade{from{opacity:0; transform:translateY(14px);}to{opacity:1; transform:none;}}
.header{padding:22px 2px 14px; text-align:center;}
.header .logo{font-size:26px; font-weight:800; background:linear-gradient(90deg,var(--pink),var(--purple),var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:none;}
.header .sub{color:var(--muted); font-size:12.5px; margin-top:4px; letter-spacing:2px;}
.card{background:var(--card); border:1px solid var(--card-border); border-radius:var(--r); padding:18px; margin:12px 0; box-shadow:var(--shadow); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);}
.card h3{font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:7px;}
.card h3 .dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(90deg,var(--pink),var(--purple)); display:inline-block;}
.muted{color:var(--muted); font-size:12px;}
.gold{color:var(--gold);}
.pink{color:var(--pink);}
/* 计时 */
.big-days{font-size:64px; font-weight:800; line-height:1; text-align:center;
  background:linear-gradient(180deg,#fff,var(--pink2)); -webkit-background-clip:text; background-clip:text; color:transparent;
  margin:8px 0 2px; filter:drop-shadow(0 6px 22px rgba(255,110,160,.35));}
.big-days small{font-size:18px; vertical-align:super;}
.ticker{text-align:center; color:var(--ink2); font-size:13px; margin-bottom:4px;}
.ticker b{color:var(--gold); font-variant-numeric:tabular-nums; font-size:15px;}
.heartbeat{text-align:center; font-size:34px; animation:beat 1.6s ease-in-out infinite; display:inline-block;}
@keyframes beat{0%,100%{transform:scale(1);}12%{transform:scale(1.18);}24%{transform:scale(1);}36%{transform:scale(1.12);}48%{transform:scale(1);}}
/* 想对你说的话 */
.quote-card{background:linear-gradient(135deg,rgba(255,126,179,.14),rgba(143,123,255,.14)); border-color:rgba(255,255,255,.16); text-align:center;}
.quote-card .q{font-size:16.5px; line-height:1.9; font-weight:600;}
.quote-card .q-mark{font-size:26px; opacity:.6; line-height:1;}
.quote-card .q-meta{margin-top:10px; font-size:11.5px; color:var(--muted); letter-spacing:1px;}
/* 倒计时 */
.event{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid rgba(255,255,255,.07);}
.event:last-child{border-bottom:none;}
.event .e-emoji{font-size:26px; width:42px; height:42px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.06); border-radius:12px; flex:0 0 auto;}
.event .e-main{flex:1; min-width:0;}
.event .e-name{font-size:15px; font-weight:600;}
.event .e-date{font-size:11.5px; color:var(--muted);}
.event .e-right{text-align:right; flex:0 0 auto;}
.event .e-days{font-size:20px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums;}
.event .e-days small{font-size:11px; font-weight:500; color:var(--muted);}
.event .e-done{color:var(--pink); font-size:13px; font-weight:700;}
.event .e-edit{margin-left:6px; opacity:.45; font-size:15px;}
/* 清单 */
.progress{height:9px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; margin:8px 0 4px;}
.progress i{display:block; height:100%; background:linear-gradient(90deg,var(--pink),var(--purple)); border-radius:99px; transition:width .5s ease;}
.todo-item{display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid rgba(255,255,255,.07);}
.todo-item:last-child{border-bottom:none;}
.todo-item .box{width:24px;height:24px;border-radius:8px;border:2px solid rgba(255,255,255,.35); flex:0 0 auto; display:flex;align-items:center;justify-content:center; font-size:14px; color:transparent; transition:.2s;}
.todo-item.done .box{background:linear-gradient(135deg,var(--pink),var(--purple)); border-color:transparent; color:#fff;}
.todo-item .t{flex:1; font-size:14px; color:var(--ink2);}
.todo-item.done .t{color:var(--muted); text-decoration:line-through;}
.todo-item .t-edit{opacity:.4; font-size:15px; flex:0 0 auto;}
/* 愿望瓶 */
.wish{position:relative; padding:16px; border-radius:16px; margin:10px 0; background:linear-gradient(135deg,rgba(255,126,179,.12),rgba(143,123,255,.12)); border:1px solid var(--card-border);}
.wish .w-tag{position:absolute; top:10px; right:12px; font-size:11px; color:var(--gold); border:1px solid rgba(255,210,138,.4); padding:2px 8px; border-radius:99px;}
.wish .w-tag.done{color:#9fe6b0; border-color:rgba(159,230,176,.4);}
.wish .w-text{font-size:15px; line-height:1.8; padding-right:70px;}
.wish .w-foot{display:flex; justify-content:space-between; align-items:center; margin-top:12px; font-size:12px; color:var(--muted);}
.wish .w-actions{display:flex; gap:12px;}
.wish .w-actions span{opacity:.6;}
/* 按钮 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; padding:11px 18px; border-radius:14px; border:none; font-size:14px; font-weight:700; cursor:pointer; background:linear-gradient(90deg,var(--pink),var(--purple)); color:#fff; box-shadow:0 8px 20px rgba(255,110,160,.3); transition:.2s;}
.btn:active{transform:scale(.96);}
.btn.ghost{background:rgba(255,255,255,.08); box-shadow:none; color:var(--ink2); border:1px solid var(--card-border);}
.btn.block{width:100%;}
.btn.sm{padding:7px 12px; font-size:12.5px; border-radius:10px;}
.btn-row{display:flex; gap:10px;}
/* 底部导航 */
.nav{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; background:rgba(20,16,48,.86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid rgba(255,255,255,.09); padding:8px 4px calc(8px + env(safe-area-inset-bottom));}
.nav button{flex:1; background:none; border:none; color:var(--muted); font-size:11px; padding:5px 0; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; transition:.2s;}
.nav button .ico{font-size:21px; line-height:1;}
.nav button.on{color:var(--pink);}
.nav button.on .ico{transform:translateY(-2px) scale(1.12);}
/* 弹窗 */
.modal-mask{position:fixed; inset:0; z-index:40; background:rgba(8,6,24,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; padding:20px; animation:fade .25s ease both;}
.modal{width:100%; max-width:400px; background:linear-gradient(160deg,#221b4e,#141037); border:1px solid var(--card-border); border-radius:22px; padding:22px; box-shadow:var(--shadow);}
.modal h3{font-size:17px; margin-bottom:16px; text-align:center;}
.field{margin-bottom:13px;}
.field label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px;}
.field input,.field textarea,.field select{width:100%; padding:11px 12px; border-radius:12px; border:1px solid var(--card-border); background:rgba(255,255,255,.06); color:var(--ink); font-size:14px; outline:none; font-family:inherit;}
.field input:focus,.field textarea:focus{border-color:var(--pink);}
.field textarea{min-height:80px; resize:vertical;}
.modal .btn-row{margin-top:16px;}
/* 提示 */
#toast-root{position:fixed; left:50%; bottom:110px; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center; pointer-events:none;}
.toast{background:rgba(30,24,64,.95); border:1px solid var(--card-border); color:var(--ink); padding:9px 16px; border-radius:99px; font-size:13px; box-shadow:var(--shadow); animation:pop .3s ease both; max-width:88vw; text-align:center;}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.92);}to{opacity:1; transform:none;}}
/* 设置/我们 */
.sync-dot{width:9px;height:9px;border-radius:50%;background:#9fe6b0; display:inline-block; margin-right:6px; box-shadow:0 0 8px rgba(159,230,176,.8);}
.sync-dot.off{background:#ff8f8f; box-shadow:0 0 8px rgba(255,143,143,.8);}
.set-row{display:flex; justify-content:space-between; align-items:center; padding:13px 4px; border-bottom:1px solid rgba(255,255,255,.07); gap:10px;}
.set-row:last-child{border-bottom:none;}
.set-row .l{font-size:14px;}
.set-row .l small{display:block; color:var(--muted); font-size:11.5px; margin-top:2px;}
.set-row .v{color:var(--muted); font-size:13px; text-align:right; word-break:break-all;}
.letter{font-size:15px; line-height:2; color:var(--ink2);}
.letter p{margin:10px 0;}
/* 首次设置 */
.setup{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:30px 18px; position:relative; z-index:2;}
.setup .big-heart{text-align:center; font-size:60px; animation:beat 1.8s ease-in-out infinite;}
.setup .title{text-align:center; font-size:26px; font-weight:800; margin:6px 0 2px; background:linear-gradient(90deg,var(--pink),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.setup .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:26px;}
.setup .card{padding:22px;}
/* 小图标 */
.small-actions{display:flex; gap:14px; align-items:center;}
.small-actions span{opacity:.55; cursor:pointer; font-size:15px;}
.small-actions span:active{opacity:1;}
/* 空态 */
.empty{text-align:center; color:var(--muted); padding:26px 0; font-size:13px;}
.empty .e-ico{font-size:34px; display:block; margin-bottom:8px; opacity:.7;}

</style>
</head>
<body>
<div id="stars"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script>
"use strict";
// ============================================================
// 云端配置：把 Supabase 的两样东西粘贴进来（部署前必填）
// anon key 本身设计为可公开，但内容仅靠房间号+暗号做门禁；
// 建议专门为这个小站建一个独立项目，别放其他敏感数据。
// ============================================================
const SB_CONFIG = {
  url: "https://ohrmhwfjutznizzrqyfj.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ocm1od2ZqdXR6bmppenJxeWZqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcxNDY4MDIsImV4cCI6MjEwMjcyMjgwMn0._0_1nGmZlpFci0FZ-YhFjDaXCIOMt6qGMi86GfqUTnQ",
  publishableKey: "sb_publishable_d0tms40ZRB3Zdt_J8pr0Eg_kZUMYHO2"
};
const START_DATE = "2024-06-14";
const LS = { room: "al_room_v1", secret: "al_secret_v1", local: "al_local_v1" };
const NL = String.fromCharCode(10);
const WISH_TYPES = [
  { id: "thing", label: "想要的东西", emoji: "🎁" },
  { id: "together", label: "想一起去", emoji: "✈️" },
  { id: "goal", label: "以后的小目标", emoji: "🌱" },
  { id: "other", label: "其他愿望", emoji: "💌" }
];

function isCloud(){ return SB_CONFIG.url && SB_CONFIG.url.indexOf("PASTE") < 0; }
function $(s, r){ return (r || document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ if (c === "&") return "&amp;"; if (c === "<") return "&lt;"; if (c === ">") return "&gt;"; if (c === '"') return "&quot;"; return "&#39;"; }); }
function hashStr(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(16) + "_" + s.length; }
function pad2(n){ return String(n).padStart(2, "0"); }
function fmtDate(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseDate(s){ const p = String(s).split("-").map(Number); return new Date(p[0], p[1] - 1, p[2] || 1); }
function todayStart(){ const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
function daysSince(start){ const s = parseDate(start); const t = todayStart(); return Math.max(0, Math.floor((t - s) / 86400000) + 1); }
function daysLeft(target){ const tgt = parseDate(target); const t = todayStart(); return Math.ceil((tgt - t) / 86400000); }
function sinceParts(start, now){ now = now || new Date(); const s = parseDate(start); let y = now.getFullYear() - s.getFullYear(); let m = now.getMonth() - s.getMonth(); let d = now.getDate() - s.getDate(); if (d < 0){ m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); } if (m < 0){ y--; m += 12; } return { y: y, m: m, d: d, h: now.getHours(), mi: now.getMinutes(), sec: now.getSeconds() }; }
function toast(msg){ const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; $("#toast-root").appendChild(el); setTimeout(function(){ el.style.opacity = "0"; el.style.transition = "opacity .4s"; setTimeout(function(){ el.remove(); }, 400); }, 2400); }
function openModal(html){ closeModal(); const mask = document.createElement("div"); mask.className = "modal-mask"; mask.innerHTML = "<div class='modal'>" + html + "</div>"; mask.addEventListener("click", function(e){ if (e.target === mask) closeModal(); }); $("#modal-root").appendChild(mask); return mask; }
function closeModal(){ $("#modal-root").innerHTML = ""; }
function emptyState(ico, text){ return "<div class='empty'><span class='e-ico'>" + ico + "</span>" + text + "</div>"; }
function copyText(txt){ const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); return ok; }

// ===== 默认内容（第一次进入时生成，之后随时共同编辑） =====
const DEFAULT_LETTER = [
  "致阿泠：",
  "",
  "2024 年 6 月 14 日，是很普通的一天，也是我往后所有日子里，最想记住的一天。",
  "这里是我们两个人的小站：想一起去的地方、想要的东西、还没实现的愿望，都慢慢写下来。",
  "日子很长，我们一件一件来。等以后回头看，这里会装满我们的以后。",
  "",
  "—— 想和阿泠一起走到很远的人"
].join(NL);

function defaultState(){
  return {
    startDate: START_DATE,
    quotes: [],
    events: [],
    todos: [],
    wishes: [],
    letter: DEFAULT_LETTER
  };
}

// ============================================================
// 应用状态
// ============================================================
let state = null;
let room = "";
let secret = "";
let objectId = null;
let lastSeen = null;
let pollTimer = null;
let pushTimer = null;
let tickerTimer = null;
let syncing = false;
let cloudOK = false;

function loadLocal(){ try { return JSON.parse(localStorage.getItem(LS.local) || "null"); } catch(e){ return null; } }
function saveLocal(){ try { localStorage.setItem(LS.local, JSON.stringify(state)); } catch(e){} }
function merge(base, src){ const out = {}; for (const k in base) out[k] = base[k]; if (src) for (const k in src) out[k] = src[k]; return out; }

// ============================================================
// 云端（Supabase REST）
// ============================================================
let activeKey = SB_CONFIG.anonKey;
let lastCloudError = "";

function sbHeaders(key){
  return {
    "apikey": key,
    "Authorization": "Bearer " + key,
    "Content-Type": "application/json"
  };
}
async function sbFetch(path, opts){
  opts = opts || {};
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, 12000);
  try {
    const res = await fetch(SB_CONFIG.url + "/rest/v1/" + path, { method: opts.method || "GET", headers: sbHeaders(activeKey), body: opts.body, signal: ctrl.signal });
    const txt = await res.text();
    let data = null;
    if (txt) { try { data = JSON.parse(txt); } catch(e) { data = null; } }
    if (!res.ok) {
      const msg = data && data.message ? data.message : ("HTTP " + res.status);
      lastCloudError = msg;
      throw new Error(msg);
    }
    return data;
  } catch(e) {
    if (e && e.name === "AbortError") lastCloudError = "请求超时（12 秒）";
    else if (!lastCloudError) lastCloudError = (e && e.message) ? e.message : "网络错误";
    throw e;
  } finally {
    clearTimeout(timer);
  }
}
async function probeKey(key){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, 12000);
  try {
    const res = await fetch(SB_CONFIG.url + "/rest/v1/couple_spaces?select=id&limit=1", { headers: sbHeaders(key), signal: ctrl.signal });
    const txt = await res.text();
    let data = null;
    if (txt) { try { data = JSON.parse(txt); } catch(e) { data = null; } }
    return { ok: res.ok, status: res.status, message: data && data.message ? data.message : "" };
  } catch(e) {
    return { ok: false, status: 0, message: (e && e.name === "AbortError") ? "请求超时" : ((e && e.message) ? e.message : "网络错误") };
  } finally {
    clearTimeout(timer);
  }
}
async function pickKey(){
  activeKey = SB_CONFIG.anonKey;
  let pr = await probeKey(activeKey);
  if (pr.ok) return pr;
  if (SB_CONFIG.publishableKey) {
    const pr2 = await probeKey(SB_CONFIG.publishableKey);
    if (pr2.ok || pr2.status === 404) { activeKey = SB_CONFIG.publishableKey; return pr2; }
    pr = pr2;
  }
  return pr;
}
async function sbGetByRoom(r){
  const arr = await sbFetch("couple_spaces?select=*&room=eq." + encodeURIComponent(r) + "&order=updated_at.desc&limit=1");
  return (arr && arr[0]) ? arr[0] : null;
}
async function sbGetById(id){
  const arr = await sbFetch("couple_spaces?select=*&id=eq." + encodeURIComponent(id));
  return (arr && arr[0]) ? arr[0] : null;
}
async function sbInsert(row){
  const arr = await sbFetch("couple_spaces", { method: "POST", body: JSON.stringify(row), prefer: "return=representation" });
  return (arr && arr[0]) ? arr[0] : null;
}
async function sbUpdate(id, fields){
  const arr = await sbFetch("couple_spaces?id=eq." + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(fields), prefer: "return=representation" });
  return (arr && arr[0]) ? arr[0] : null;
}
function hashSecret(){ return hashStr(room + "::" + secret); }

async function cloudBoot(){
  try {
    const pr = await pickKey();
    if (!pr.ok) {
      lastCloudError = pr.message || ("HTTP " + pr.status);
      throw new Error(lastCloudError);
    }
    let obj = await sbGetByRoom(room);
    if (obj) {
      if ((obj.secret_hash || "") !== hashSecret()) { toast("暗号好像变了，重新输入一下"); lockOut(); return; }
      state = merge(defaultState(), JSON.parse(obj.data || "{}"));
      objectId = obj.id;
      lastSeen = obj.updated_at;
    } else {
      const now = new Date().toISOString();
      obj = await sbInsert({ room: room, secret_hash: hashSecret(), data: JSON.stringify(defaultState()), updated_at: now, created_at: now });
      state = defaultState();
      objectId = obj.id;
      lastSeen = obj.updated_at;
    }
    cloudOK = true;
    saveLocal();
    renderAll();
    startPoll();
  } catch(e) {
    console.warn("cloud boot failed", e);
    cloudOK = false;
    lastCloudError = lastCloudError || ((e && e.message) ? e.message : "未知错误");
    toast("云端连不上：" + lastCloudError);
  }
}

async function push(){
  if (!isCloud() || !objectId || syncing) return;
  syncing = true;
  setSync("...");
  try {
    const now = new Date().toISOString();
    const obj = await sbUpdate(objectId, { data: JSON.stringify(state), updated_at: now });
    lastSeen = obj ? obj.updated_at : now;
    cloudOK = true;
    setSync("ok");
  } catch(e) {
    cloudOK = false;
    setSync("off");
  } finally { syncing = false; }
}

async function poll(){
  if (!isCloud() || !objectId) return;
  try {
    const obj = await sbGetById(objectId);
    if (obj && obj.updated_at && obj.updated_at !== lastSeen) {
      state = merge(defaultState(), JSON.parse(obj.data || "{}"));
      lastSeen = obj.updated_at;
      saveLocal();
      renderAll();
    }
    cloudOK = true;
    setSync("ok");
  } catch(e) { cloudOK = false; setSync("off"); }
}

function schedulePush(){ if (isCloud()){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 500); } else { saveLocal(); } }
function persist(){ schedulePush(); }
function startPoll(){ stopPoll(); if (isCloud()) pollTimer = setInterval(poll, 3500); }
function stopPoll(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
function setSync(s){
  const dot = $("#syncDot");
  if (!dot) return;
  if (s === "ok"){ dot.className = "sync-dot"; $("#syncText").textContent = "云端同步正常"; }
  else if (s === "..."){ dot.className = "sync-dot"; $("#syncText").textContent = "同步中…"; }
  else { dot.className = "sync-dot off"; $("#syncText").textContent = "云端未连接"; const err = $("#syncErr"); if (err) err.textContent = lastCloudError || ""; }
}

  return { text: state.quotes[idx], meta: "第 " + (idx + 1) + " 句 · 共 " + state.quotes.length + " 句" };

function nextEvent(){

}

    ev.preventDefault();
    const f = new FormData(ev.target);
    const a = String(f.get("s") || "");
    const b = String(f.get("s2") || "");
    if (!a || a !== b) return toast("两次输入要一致");
    secret = a;
    localStorage.setItem(LS.secret, secret);
    closeModal();
    if (isCloud() && objectId) {
      sbUpdate(objectId, { secret_hash: hashSecret(), updated_at: new Date().toISOString() })
        .then(function(){ toast("暗号已更新并同步"); })
        .catch(function(){ toast("暗号已在本机更新，云端稍后同步"); });
    } else { toast("暗号已更新"); }
  });
}

function exportBackup(){
  const txt = JSON.stringify(state, null, 2);
  openModal("<h3>导出备份</h3>" +
    "<p class='muted' style='margin-bottom:8px;'>复制下面这段文字，发给自己或存到备忘录；需要时再粘回来恢复。</p>" +
    "<textarea id='bk' readonly style='width:100%;height:140px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:#f6f2ff;padding:10px;font-size:12px;'>" + esc(txt) + "</textarea>" +
    "<div class='btn-row' style='margin-top:12px;'><button class='btn' style='flex:1;' id='copyBtn'>复制</button><button class='btn ghost' data-act='close'>关闭</button></div>");
  $("#copyBtn").addEventListener("click", function(){
    const ok = copyText(txt);
    toast(ok ? "已复制，去粘贴保存吧" : "复制失败，请长按手动复制");
  });
}
function importBackup(){
  openModal("<h3>恢复备份</h3>" +
    "<p class='muted' style='margin-bottom:8px;'>把之前导出的文字粘贴进来，点恢复。</p>" +
    "<textarea id='bk2' placeholder='粘贴备份文字' style='width:100%;height:140px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(0,0,0,.25);color:#f6f2ff;padding:10px;font-size:12px;'></textarea>" +
    "<div class='btn-row' style='margin-top:12px;'><button class='btn' style='flex:1;' id='restoreBtn'>恢复</button><button class='btn ghost' data-act='close'>取消</button></div>");
  $("#restoreBtn").addEventListener("click", function(){
    const v = $("#bk2").value.trim();
    if (!v) return toast("先粘贴内容");
    try {
      const obj = JSON.parse(v);
      state = merge(defaultState(), obj);
      persist(); renderAll(); closeModal(); toast("已恢复备份");
    } catch(e) { toast("格式不对，检查一下"); }
  });
}

function manualSync(){
  if (!isCloud()) return toast("还没配置云端");
  toast("正在同步…");
  poll().then(function(){ return push(); }).then(function(){ toast("同步完成"); }).catch(function(e){ toast("同步失败：" + ((e && e.message) ? e.message : "未知错误")); });
}
async function testReach(){
  const ctrl = new AbortController();
  const timer = setTimeout(function(){ ctrl.abort(); }, 12000);
  try {
    await fetch(SB_CONFIG.url + "/auth/v1/health", { mode: "no-cors", signal: ctrl.signal });
    return true;
  } catch(e) {
    return false;
  } finally {
    clearTimeout(timer);
  }
}
async function testCloud(){
  if (!isCloud()) return toast("还没配置云端");
  toast("正在测试…");
  const reach = await testReach();
  if (!reach) { toast("网络连不上 Supabase，试试换 WiFi/流量，或把这个结果告诉我"); return; }
  const pr = await pickKey();
  if (pr.ok) toast("网络通、云端正常，可以同步");
  else if (pr.status === 0) toast("网络通，但被跨域拦截(CORS)，把这句话发我");
  else toast("云端出错：" + (pr.message || ("HTTP " + pr.status)));
}

// ============================================================
// 首次进入：房间号 + 暗号
// ============================================================
function showSetup(){
  $("#app").innerHTML =
    "<div class='setup'>" +
      "<div class='big-heart'>💗</div>" +
      "<div class='title'>阿泠 · 我们的以后</div>" +
      "<div class='sub'>两个人共同的未来小站</div>" +
      "<div class='card'>" +
        "<form id='setupForm'>" +
          "<div class='field'><label>房间号（两个人约定一个名字）</label><input id='inRoom' required maxlength='40' placeholder='比如 alingforever' value='" + esc(room) + "'></div>" +
          "<div class='field'><label>暗号（只有两个人知道）</label><input id='inSecret' type='password' required maxlength='40' placeholder='设置一个暗号'></div>" +
          "<button class='btn block' type='submit'>进入我们的以后 →</button>" +
        "</form>" +
        "<p class='muted' style='margin-top:14px;text-align:center;'>房间号和暗号要填得一样，两边才会看到同一份内容</p>" +
      "</div>" +
    "</div>";
  $("#setupForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    room = $("#inRoom").value.trim();
    secret = $("#inSecret").value.trim();
    if (!room || !secret) return toast("都要填哦");
    localStorage.setItem(LS.room, room);
    localStorage.setItem(LS.secret, secret);
    boot();
  });
}

function lockOut(){
  localStorage.removeItem(LS.room);
  localStorage.removeItem(LS.secret);
  stopPoll();
  room = "";
  secret = "";
  showSetup();
}

function boot(){
  room = localStorage.getItem(LS.room) || "";
  secret = localStorage.getItem(LS.secret) || "";
  if (!room || !secret) { showSetup(); return; }
  state = merge(defaultState(), loadLocal() || {});
  renderShell();
  if (isCloud()) { cloudBoot(); }
  else { cloudOK = false; toast("离线预览模式：配置云端后即可两人共同编辑"); }
}

// ============================================================
// 事件分发
// ============================================================
function handleAction(act, id){
  if (act === "close") return closeModal();
  if (act === "tab") return switchTab(id);
  if (act === "addEvent") return eventModal();
  if (act === "editEvent") return eventModal(id);
  if (act === "delEvent") return delEvent(id);
  if (act === "addTodo") return todoModal();
  if (act === "toggleTodo") return toggleTodo(id);
  if (act === "editTodo") return todoModal(id);
  if (act === "delTodo") return delTodo(id);
  if (act === "addWish") return wishModal();
  if (act === "toggleWish") return toggleWish(id);
  if (act === "editWish") return wishModal(id);
  if (act === "delWish") return delWish(id);
  if (act === "addQuote") return quoteModal();
  if (act === "editQuote") return quoteModal(Number(id));
  if (act === "delQuote") return delQuote(Number(id));
  if (act === "editLetter") return letterModal();
  if (act === "editDate") return dateModal();
  if (act === "exportBackup") return exportBackup();
  if (act === "importBackup") return importBackup();
  if (act === "manualSync") return manualSync();
  if (act === "testCloud") return testCloud();
  if (act === "changeSecret") return changeSecret();
  if (act === "lock") return lockOut();
}

function makeStars(){
  const box = $("#stars");
  const n = 60;
  let html = "";
  for (let i = 0; i < n; i++){
    const s = (Math.random() * 2 + 1).toFixed(1);
    const x = (Math.random() * 100).toFixed(2);
    const y = (Math.random() * 100).toFixed(2);
    const delay = (Math.random() * 4).toFixed(1);
    html += "<span class='star' style='width:" + s + "px;height:" + s + "px;left:" + x + "%;top:" + y + "%;animation-delay:" + delay + "s;'></span>";
  }
  box.innerHTML = html;
}

function init(){
  makeStars();
  document.addEventListener("click", function(ev){
    const el = ev.target && ev.target.closest ? ev.target.closest("[data-act]") : null;
    if (!el) return;
    handleAction(el.getAttribute("data-act"), el.getAttribute("data-id"));
  });
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && isCloud()) poll();
  });
  boot();
}
init();

</script>
